<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection API - Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            margin-top: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #495057;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .predict-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .predict-btn:hover {
            background: #5a67d8;
        }

        .result-section {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .result-section.show {
            display: block;
        }

        .result-section.fraud {
            background: #fff5f5;
            border: 2px solid #fc8181;
        }

        .result-section.legit {
            background: #f0fff4;
            border: 2px solid #68d391;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛡️ Insurance Fraud Detection</h1>

        <div class="config-section">
            <div class="config-grid">
                <div class="form-group">
                    <label>Model Type</label>
                    <select id="model">
                        <option value="xgb" selected>XGBoost (Recommended)</option>
                        <option value="rf">Random Forest</option>
                        <option value="et">Extra Trees</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Scenario</label>
                    <select id="scenario">
                        <option value="dashboard" selected>Dashboard (Calibrated)</option>
                        <option value="auto_flagger">Auto-Flagger (Uncalibrated)</option>
                    </select>
                </div>
            </div>
        </div>

        <form id="claimForm" novalidate>
            <div class="input-grid">
                <!-- Numeric Fields -->
                <div class="form-group"><label>Annual Premium ($)</label><input type="text" inputmode="decimal"
                        id="policy_annual_premium" value="1200"></div>
                <div class="form-group"><label>Claim Amount ($)</label><input type="text" inputmode="decimal"
                        id="total_claim_amount" value="52000"></div>
                <div class="form-group"><label>Vehicle Age (Years)</label><input type="text" inputmode="numeric"
                        id="vehicle_age" value="12"></div>
                <div class="form-group"><label>Days Since Bind</label><input type="text" inputmode="numeric"
                        id="days_since_bind" value="300"></div>
                <div class="form-group"><label>Months as Customer</label><input type="text" inputmode="numeric"
                        id="months_as_customer" value="48"></div>

                <div class="form-group"><label>Injury Share (0-1)</label><input type="text" inputmode="decimal"
                        id="injury_share" value="0.1"></div>
                <div class="form-group"><label>Property Share (0-1)</label><input type="text" inputmode="decimal"
                        id="property_share" value="0.1"></div>
                <div class="form-group"><label>Umbrella Limit</label><input type="text" inputmode="numeric"
                        id="umbrella_limit" value="0">
                </div>
                <div class="form-group"><label>Incident Hour (0-23)</label><input type="text" inputmode="numeric"
                        id="incident_hour_of_the_day" value="14"></div>

                <div class="form-group"><label>Cap Gains</label><input type="text" inputmode="decimal"
                        id="capital_gains" value="0"></div>
                <div class="form-group"><label>Cap Loss</label><input type="text" inputmode="decimal" id="capital_loss"
                        value="0"></div>

                <!-- New Categorical Fields -->
                <div class="form-group">
                    <label>Severity</label>
                    <select id="incident_severity">
                        <option value="Major Damage" selected>Major Damage</option>
                        <option value="Minor Damage">Minor Damage</option>
                        <option value="Total Loss">Total Loss</option>
                        <option value="Trivial Damage">Trivial Damage</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Collision Type</label>
                    <select id="collision_type">
                        <option value="Rear Collision" selected>Rear Collision</option>
                        <option value="Side Collision">Side Collision</option>
                        <option value="Front Collision">Front Collision</option>
                        <option value="?">Unknown (?)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Police Report</label>
                    <select id="police_report_available">
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                        <option value="?">Unknown (?)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Authorities</label>
                    <select id="authorities_contacted">
                        <option value="Police">Police</option>
                        <option value="Fire">Fire</option>
                        <option value="Ambulance">Ambulance</option>
                        <option value="Other">Other</option>
                        <option value="None">None</option>
                    </select>
                </div>

                <div class="form-group"><label>Vehicles Involved</label><input type="text" inputmode="numeric"
                        id="number_of_vehicles_involved" value="1"></div>
                <div class="form-group"><label>Bodily Injuries</label><input type="text" inputmode="numeric"
                        id="bodily_injuries" value="1"></div>
            </div>

            <button type="button" class="predict-btn" id="predictBtn">🔍 Analyze Claim</button>
        </form>

        <div id="resultSection" class="result-section">
            <h2 id="resultTitle">Result</h2>
            <p id="resultText"></p>
        </div>
        <div id="errorBox"
            style="color:red; margin-top:10px; display:none; padding:10px; background:#ffeeee; border:1px solid red; border-radius:4px;">
        </div>
    </div>

    <script>
        // Helper to parse localized numbers (handles comma vs dot)
        function parseNum(id, isFloat = true) {
            const el = document.getElementById(id);
            if (!el) return 0;

            // Replace comma with dot and remove non-numeric chars except . and -
            let valStr = el.value.replace(',', '.').replace(/[^0-9.-]/g, '');

            if (valStr === '' || valStr === '.') return 0;

            const num = parseFloat(valStr);
            return isNaN(num) ? 0 : (isFloat ? num : Math.round(num));
        }

        document.getElementById('predictBtn').addEventListener('click', async (e) => {
            // Prevent default just in case, though type="button" shouldn't submit
            e.preventDefault();

            const btn = document.getElementById('predictBtn');
            const res = document.getElementById('resultSection');
            const err = document.getElementById('errorBox');

            console.log("Analyze button clicked");

            btn.disabled = true;
            btn.innerText = "Analyzing...";
            res.style.display = 'none';
            err.style.display = 'none';

            try {
                // Construct payload using robust parser
                const formData = {
                    // Numeric
                    policy_annual_premium: parseNum('policy_annual_premium'),
                    total_claim_amount: parseNum('total_claim_amount'),
                    vehicle_age: parseNum('vehicle_age', false),
                    days_since_bind: parseNum('days_since_bind', false),
                    months_as_customer: parseNum('months_as_customer', false),
                    "capital-gains": parseNum('capital_gains'),
                    "capital-loss": parseNum('capital_loss'),
                    injury_share: parseNum('injury_share'),
                    property_share: parseNum('property_share'),
                    umbrella_limit: parseNum('umbrella_limit', false),
                    incident_hour_of_the_day: parseNum('incident_hour_of_the_day', false),

                    // Categorical (Direct values)
                    incident_severity: document.getElementById('incident_severity').value,
                    collision_type: document.getElementById('collision_type').value,
                    police_report_available: document.getElementById('police_report_available').value,
                    authorities_contacted: document.getElementById('authorities_contacted').value,
                    number_of_vehicles_involved: parseNum('number_of_vehicles_involved', false),
                    bodily_injuries: parseNum('bodily_injuries', false)
                };

                console.log("Sending payload:", formData);

                const model = document.getElementById('model').value;
                const scenario = document.getElementById('scenario').value;

                const response = await fetch(`/predict?model=${model}&scenario=${scenario}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error("API Error:", data);
                    throw new Error(data.detail || 'Server provided no error detail');
                }

                // Display
                res.classList.remove('fraud', 'legit');
                res.classList.add('show');

                const probPct = (data.probability * 100).toFixed(1);

                if (data.probability > 0.5) {
                    res.classList.add('fraud');
                    document.getElementById('resultTitle').innerText = `⚠️ HIGH RISK: ${probPct}%`;
                } else {
                    res.classList.add('legit');
                    document.getElementById('resultTitle').innerText = `✅ LOW RISK: ${probPct}%`;
                }

                let detail = `Model: ${data.model} (${data.calibrated ? 'Calibrated' : 'Uncalibrated'})`;
                if (data.threshold_flag) detail += `<br><strong>Decision: ${data.threshold_flag}</strong>`;

                document.getElementById('resultText').innerHTML = detail;

            } catch (error) {
                console.error("Frontend Error:", error);
                err.innerText = "Error: " + error.message;
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "🔍 Analyze Claim";
            }
        });
    </script>
</body>

</html>
